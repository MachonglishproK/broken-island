<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --sea:#0c2233; --sea2:#123249; --sand:#f7efdd; --sand2:#efe3c8;
    --ink:#2b2317; --coral:#d64541; --teal:#2fa8a0; --gold:#c9a24b;
  }
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, #1b4a63 0%, transparent 60%),
      var(--sea);
    color:var(--sand); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .app{ width:100%; max-width:620px; position:relative; }
  .lang-toggle{
    position:absolute; top:-6px; right:0; z-index:5;
    background:rgba(255,255,255,.08); color:var(--sand);
    border:1px solid rgba(255,255,255,.25); border-radius:20px;
    padding:6px 14px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .screen{ display:none; animation:fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .bureau-head{ text-align:center; margin-bottom:18px; padding-top:26px; }
  .bureau-head .flag{ font-size:44px; }
  .bureau-head h1{ font-size:22px; letter-spacing:.18em; margin-top:6px; font-weight:800; }
  .bureau-head .en{ font-size:10px; letter-spacing:.42em; color:#9db8c6; margin-top:6px; }
  .card{
    background:linear-gradient(175deg, var(--sand), var(--sand2));
    color:var(--ink); border-radius:14px; padding:26px 24px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:8px;
    background:repeating-linear-gradient(45deg,var(--coral) 0 14px,var(--sand) 14px 28px,var(--teal) 28px 42px,var(--sand) 42px 56px);
    opacity:.85;
  }
  .notice{
    border:2px solid var(--ink); border-radius:8px; padding:14px 16px;
    font-size:14px; line-height:1.9; background:rgba(255,255,255,.4); margin:14px 0 18px;
  }
  .notice b{ color:var(--coral); }
  .notice small{ font-size:11px; color:#8a7d64; }
  .stamp-note{ font-size:11px; color:#7a6f5c; text-align:center; margin-top:14px; line-height:1.7;}
  label{ font-size:12px; font-weight:700; letter-spacing:.1em; display:block; margin-bottom:6px; color:#5a4f3d;}
  input[type=text]{
    width:100%; padding:12px 14px; font-size:16px; border:2px solid var(--ink);
    border-radius:8px; background:#fffdf6; font-family:inherit;
  }
  .btn{
    display:block; width:100%; padding:15px; margin-top:14px;
    font-size:16px; font-weight:800; letter-spacing:.12em;
    border:none; border-radius:10px; cursor:pointer; font-family:inherit;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--coral); color:#fff; box-shadow:0 6px 0 #a33330; }
  .btn-primary:active{ box-shadow:0 2px 0 #a33330; }
  .btn-ghost{ background:transparent; border:2px dashed #8a7d64; color:#6b5f49; font-size:13px; padding:11px; }
  .btn-teal{ background:var(--teal); color:#fff; box-shadow:0 6px 0 #1f7a74; }
  .demo-row{ display:flex; gap:10px; }
  .demo-row .btn{ margin-top:10px; }

  .officer{ display:flex; gap:12px; align-items:flex-start; margin-bottom:16px; }
  .officer .face{
    font-size:38px; background:#fffdf6; border:2px solid var(--ink);
    border-radius:50%; width:62px; height:62px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .bubble{
    background:#fffdf6; border:2px solid var(--ink); border-radius:12px;
    padding:12px 14px; font-size:14px; line-height:1.8; position:relative; flex:1;
  }
  .bubble::before{
    content:""; position:absolute; left:-9px; top:20px;
    border:8px solid transparent; border-right-color:var(--ink);
  }
  .bubble .en{ display:block; font-size:11px; color:#8a7d64; letter-spacing:.06em; margin-top:4px; font-style:italic;}

  .rec-zone{ text-align:center; padding:6px 0 2px; }
  .ring-wrap{ position:relative; width:150px; height:150px; margin:8px auto 4px; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:#d8ccb2; stroke-width:9; }
  .ring-fg{ fill:none; stroke:var(--coral); stroke-width:9; stroke-linecap:round; }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .ring-center .sec{ font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .ring-center .mic{ font-size:20px; }
  .pulse{ animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  #wave{ width:100%; height:56px; display:block; margin:10px 0 4px; }
  .rec-hint{ font-size:12px; color:#7a6f5c; line-height:1.7; }
  .error-box{
    display:none; margin-top:12px; border:2px solid var(--coral); border-radius:8px;
    background:#fdeceb; color:#8c2320; font-size:13px; padding:12px 14px; line-height:1.7;
  }

  .judging{ text-align:center; padding:36px 0 30px; }
  .judging .glass{ font-size:54px; animation:wobble 1.2s infinite; display:inline-block; }
  @keyframes wobble{ 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(10deg)} }
  #judgeMsg{ margin-top:18px; font-size:15px; font-weight:700; min-height:1.6em; }
  .dots::after{ content:""; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots{ 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }

  .shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{transform:none} 20%{transform:translate(-6px,2px) rotate(-.6deg)}
    40%{transform:translate(5px,-3px) rotate(.5deg)} 60%{transform:translate(-4px,2px)}
    80%{transform:translate(3px,-1px)}
  }
  .stamp{
    margin:6px auto 14px; width:fit-content; padding:12px 26px;
    border:6px double currentColor; border-radius:10px;
    font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
    font-weight:900; text-align:center; transform:rotate(-9deg);
    animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both; opacity:.92;
  }
  @keyframes stampIn{
    0%{ transform:scale(3.4) rotate(-28deg); opacity:0; }
    55%{ transform:scale(.92) rotate(-9deg); opacity:1; }
    75%{ transform:scale(1.05) rotate(-9deg); }
    100%{ transform:scale(1) rotate(-9deg); opacity:.92; }
  }
  .stamp .big{ font-size:30px; letter-spacing:.1em; display:block; }
  .stamp .small{ font-size:11px; letter-spacing:.3em; display:block; margin-top:3px; }
  .stamp.denied{ color:var(--coral); }
  .stamp.passed{ color:#1d6f9e; }
  .verdict-msg{ text-align:center; font-size:14px; line-height:2; margin-bottom:16px; }
  .verdict-msg b{ font-size:16px; }
  .verdict-msg .sub{ font-size:12px; color:#8a7d64; font-style:italic; }

  .passport{
    border:3px solid var(--gold); border-radius:12px; padding:18px 18px 14px;
    background:
      radial-gradient(circle at 85% 12%, rgba(201,162,75,.25), transparent 45%),
      #fbf6e8;
    margin-bottom:16px; position:relative;
  }
  .passport .pp-head{ text-align:center; font-size:11px; letter-spacing:.34em; color:#8a6d2f; font-weight:800; }
  .passport .pp-title{ text-align:center; font-size:17px; font-weight:900; margin:4px 0 12px; letter-spacing:.06em;}
  .pp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:13px; }
  .pp-grid .k{ font-size:10px; color:#8a7d64; letter-spacing:.14em; }
  .pp-grid .v{ font-weight:800; font-size:15px; }
  .pp-seal{ position:absolute; right:12px; bottom:8px; font-size:34px; opacity:.55; transform:rotate(14deg); }
  .passport.detention{ border-color:var(--coral); background:
      radial-gradient(circle at 85% 12%, rgba(214,69,65,.14), transparent 45%), #fdf1ee; }
  .passport.detention .pp-head{ color:var(--coral); }
  .evidence{
    border:2px dashed var(--coral); border-radius:8px; background:#fff7f6;
    font-size:12.5px; line-height:1.9; padding:10px 14px; margin:10px 0 2px; color:#7a2a27;
  }

  .metrics{ margin:4px 0 16px; }
  .metric{ margin-bottom:11px; }
  .metric .row{ display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:4px; }
  .metric .tag{ font-size:11px; padding:1px 8px; border-radius:20px; border:1.5px solid; }
  .tag.good{ color:#1e7a4c; border-color:#1e7a4c; background:#e7f5ec; }
  .tag.bad{ color:var(--coral); border-color:var(--coral); background:#fdeceb; }
  .bar{ height:9px; background:#e2d7bd; border-radius:20px; overflow:hidden; }
  .bar > div{ height:100%; border-radius:20px; width:0%; transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .transcript{
    font-size:12px; color:#6b5f49; background:rgba(255,255,255,.5);
    border-left:3px solid var(--gold); padding:8px 12px; margin-bottom:14px;
    font-style:italic; line-height:1.7; word-break:break-word;
  }
  .copied{ filter:brightness(1.1); }
  .footer{ text-align:center; font-size:10px; color:#57718a; margin-top:16px; letter-spacing:.2em; }
</style>
</head>

   イベントは track('name') で event/name として記録される。 */
function track(name){
  try{
    if (window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({ path: 'event/' + name, title: name, event: true });
  }catch(_){}
}

let LANG = 'en'; // EN distribution page: always defaults to English
function t(key){ return I18N[LANG][key]; }

function applyLang(){
  const d = I18N[LANG];
  document.documentElement.lang = LANG;
  document.title = d.htmlTitle;
  document.getElementById('langBtn').textContent = d.langBtn;
  const set = (id, key) => { document.getElementById(id).innerHTML = d[key]; };
  set('tLandingH1','landingH1'); set('tLandingSub','landingSub');
  set('tNotice','notice'); set('tNameLabel','nameLabel');
  document.getElementById('visitorName').placeholder = d.namePh;
  set('tStartBtn','startBtn');
  set('tDemoPass','demoPass'); set('tDemoDeny','demoDeny'); set('tDemoArrest','demoArrest');
  set('tStampNote','stampNote');
  set('tExamH1','examH1'); set('tExamSub','examSub');
  set('officerLine','officerAsk');
  set('recHint','recHintIdle');
  document.getElementById('recBtn').innerHTML = recording ? d.recStop : d.recStart;
  set('tJudgingH1','judgingH1'); set('tJudgingSub','judgingSub');
  set('tResultSub','resultSub');
  set('copyBtn','copyBtn'); set('retryBtn','retryBtn');
  document.querySelectorAll('.i-back').forEach(b => { b.innerHTML = d.backBtn; });
}
function switchLang(){
  LANG = (LANG === 'ja') ? 'en' : 'ja';
  applyLang();
  track('lang-' + LANG);
}

/* ---------- state ---------- */
const MAX_SEC = 30, MIN_SEC = 5;
const RING_LEN = 414.7;
let mediaStream = null, audioCtx = null, analyser = null;
let recognition = null;
let recording = false, startTs = 0, rafId = null;
let rmsFrames = [], transcript = '', confidences = [];
let lastResult = null;

/* ---------- navigation ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goExam(){
  resetExamUI();
  show('screen-exam');
}

/* ---------- recording ---------- */
function resetExamUI(){
  stopEverything();
  rmsFrames = []; transcript = ''; confidences = [];
  document.getElementById('secLeft').textContent = MAX_SEC;
  document.getElementById('ringFg').style.strokeDashoffset = RING_LEN;
  document.getElementById('recBtn').innerHTML = t('recStart');
  document.getElementById('recHint').innerHTML = t('recHintIdle');
  document.getElementById('micIcon').classList.remove('pulse');
  document.getElementById('micError').style.display = 'none';
  const cv = document.getElementById('wave');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

async function toggleRec(){
  if (recording) { finishRecording(); return; }
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch(e){
    const box = document.getElementById('micError');
    box.style.display = 'block';
    box.innerHTML = t('micErr');
    track('mic-error');
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(mediaStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(analyser);

  startRecognition();

  recording = true;
  startTs = performance.now();
  rmsFrames = []; transcript = ''; confidences = [];
  document.getElementById('recBtn').innerHTML = t('recStop');
  document.getElementById('micIcon').classList.add('pulse');
  document.getElementById('recHint').innerHTML = t('recHintRec');
  track('exam-start');
  loop();
}

function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { recognition = null; return; }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.onresult = (ev) => {
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      if (ev.results[i].isFinal){
        transcript += ev.results[i][0].transcript + ' ';
        if (typeof ev.results[i][0].confidence === 'number' && ev.results[i][0].confidence > 0)
          confidences.push(ev.results[i][0].confidence);
      }
    }
  };
  recognition.onend = () => { if (recording) { try{ recognition.start(); }catch(_){} } };
  recognition.onerror = () => {};
  try { recognition.start(); } catch(_){}
}

function loop(){
  if (!recording) return;
  const elapsed = (performance.now() - startTs) / 1000;
  const left = Math.max(0, MAX_SEC - elapsed);
  document.getElementById('secLeft').textContent = Math.ceil(left);
  document.getElementById('ringFg').style.strokeDashoffset = RING_LEN * (left / MAX_SEC);

  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++){ const v = (buf[i]-128)/128; sum += v*v; }
  const rms = Math.sqrt(sum / buf.length);
  rmsFrames.push(rms);
  drawWave();

  if (left <= 0){ finishRecording(); return; }
  rafId = requestAnimationFrame(loop);
}

function drawWave(){
  const cv = document.getElementById('wave'), ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const N = 90, w = cv.width / N;
  const startI = Math.max(0, rmsFrames.length - N);
  for (let i = startI; i < rmsFrames.length; i++){
    const h = Math.min(1, rmsFrames[i]*6) * cv.height;
    const x = (i - startI) * w;
    ctx.fillStyle = rmsFrames[i] > 0.03 ? '#d64541' : '#c9bd9f';
    ctx.fillRect(x, (cv.height - h)/2, w*0.6, Math.max(2,h));
  }
}

function stopEverything(){
  recording = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (recognition){ try{ recognition.onend = null; recognition.stop(); }catch(_){} recognition = null; }
  if (mediaStream){ mediaStream.getTracks().forEach(tr => tr.stop()); mediaStream = null; }
  if (audioCtx){ try{ audioCtx.close(); }catch(_){} audioCtx = null; }
}

function finishRecording(){
  const dur = (performance.now() - startTs) / 1000;
  stopEverything();
  document.getElementById('micIcon').classList.remove('pulse');
  if (dur < MIN_SEC){
    const box = document.getElementById('micError');
    box.style.display = 'block';
    box.innerHTML = t('tooShort');
    document.getElementById('recBtn').innerHTML = t('recStart');
    return;
  }
  track('exam-complete');
  show('screen-judging');
  playJudging(() => {
    const m = computeMetrics(dur);
    lastResult = judge(m);
    if (lastResult.arrested){
      const el = document.getElementById('judgeMsg');
      el.style.color = '#d64541';
      el.textContent = t('arrestWait');
      setTimeout(() => { el.style.color = ''; renderResult(lastResult); }, 1500);
    } else {
      renderResult(lastResult);
    }
  });
}

/* ---------- judging animation ---------- */
function playJudging(done){
  let i = 0;
  const lines = t('judgeLines');
  const el = document.getElementById('judgeMsg');
  el.textContent = lines[0];
  const iv = setInterval(() => {
    i++;
    if (i >= lines.length){ clearInterval(iv); done(); return; }
    el.textContent = lines[i];
  }, 950);
}

/* ---------- scoring ---------- */
function computeMetrics(dur){
  const peak = Math.max(0.02, ...rmsFrames);
  const thresh = Math.max(0.012, peak * 0.18);
  const speaking = rmsFrames.filter(r => r > thresh).length;
  const pauseRatio = rmsFrames.length ? 1 - speaking / rmsFrames.length : 1;

  const words = transcript.trim() ? transcript.trim().split(/\s+/) : [];
  const wpm = words.length / dur * 60;
  const avgLen = words.length ? words.join('').length / words.length : 0;
  const ADV = ['opportunity','experience','definitely','absolutely','particularly','environment',
    'communicate','communication','international','professional','organization','development',
    'nevertheless','furthermore','although','regarding','appreciate','enthusiastic','passionate',
    'responsible','collaborate','perspective','essentially','specifically','currently'];
  const lower = transcript.toLowerCase();
  const advCount = ADV.filter(w => lower.includes(w)).length;
  const clarity = confidences.length
    ? confidences.reduce((a,b)=>a+b,0) / confidences.length * 100
    : null;
  const asrWorked = words.length >= 5;

  return { dur, pauseRatio, words: words.length, wpm, avgLen, advCount, clarity, asrWorked,
           transcript: transcript.trim() };
}

function judge(m){
  let fluency, earOnly = false;
  if (m.asrWorked){
    const wpmScore  = Math.min(100, m.wpm / 140 * 100);
    const vocabScore = Math.min(100, m.advCount * 18 + Math.max(0,(m.avgLen - 3.4)) * 28);
    const flowScore = Math.max(0, 100 * (1 - m.pauseRatio * 1.6));
    const clarityScore = m.clarity === null ? 65 : m.clarity;
    fluency = 0.34*wpmScore + 0.27*clarityScore + 0.19*vocabScore + 0.20*flowScore;
  } else {
    earOnly = true;
    fluency = Math.max(5, Math.min(90, 95 * (1 - m.pauseRatio * 1.7)));
  }
  fluency = Math.round(Math.max(0, Math.min(100, fluency)));
  const heta = 100 - fluency;

  // Fake-Broken offense: slow but too clean
  const arrested = m.asrWorked && m.wpm > 0 && m.wpm < 85 &&
    ((m.clarity !== null && m.clarity >= 80) || m.advCount >= 3);

  const pass = !arrested && fluency < 60;
  let rankKey = null;
  if (heta >= 80) rankKey = 'legend';
  else if (heta >= 60) rankKey = 'certified';
  else if (heta >= 40) rankKey = 'barely';
  return { ...m, fluency, heta, pass, arrested, rankKey, earOnly, demo:false };
}

/* ---------- demo ---------- */
function runDemo(kind){
  track('demo-' + kind);
  show('screen-judging');
  playJudging(() => {
    if (kind === 'pass'){
      lastResult = { fluency:28, heta:72, pass:true, arrested:false, rankKey:'certified',
        wpm:52, pauseRatio:0.46, advCount:0, clarity:41, asrWorked:true, earOnly:false, demo:true,
        transcript:"Hello... my name is... eto... I like... sleeping. Thank you." };
      renderResult(lastResult);
    } else if (kind === 'deny'){
      lastResult = { fluency:84, heta:16, pass:false, arrested:false, rankKey:null,
        wpm:138, pauseRatio:0.08, advCount:4, clarity:93, asrWorked:true, earOnly:false, demo:true,
        transcript:"Hi, I'm absolutely thrilled to introduce myself. I've spent years developing international communication skills..." };
      renderResult(lastResult);
    } else {
      lastResult = { fluency:44, heta:56, pass:false, arrested:true, rankKey:null,
        wpm:48, pauseRatio:0.42, advCount:2, clarity:92, asrWorked:true, earOnly:false, demo:true,
        transcript:"Hello. My name is... um... I am very bad at English. I cannot speak English well. Sorry." };
      const el = document.getElementById('judgeMsg');
      el.style.color = '#d64541';
      el.textContent = t('arrestWait');
      setTimeout(() => { el.style.color = ''; renderResult(lastResult); }, 1500);
    }
  });
}

/* ---------- result rendering ---------- */
function metricRow(label, valuePct, islandGood, note){
  const tag = islandGood
    ? `<span class="tag good">${t('tagGood')}</span>`
    : `<span class="tag bad">${t('tagBad')}</span>`;
  const color = islandGood ? '#2fa8a0' : '#d64541';
  return `<div class="metric">
    <div class="row"><span>${label} <small style="color:#8a7d64;font-weight:400">${note}</small></span>${tag}</div>
    <div class="bar"><div style="background:${color}" data-w="${Math.round(valuePct)}"></div></div>
  </div>`;
}

function renderResult(r){
  const d = I18N[LANG];
  const name = (document.getElementById('visitorName').value.trim() || 'NO NAME').toUpperCase();
  const flag = document.getElementById('resultFlag');
  const title = document.getElementById('resultTitle');
  const stampArea = document.getElementById('stampArea');
  const verdict = document.getElementById('verdictMsg');
  const ppArea = document.getElementById('passportArea');
  const trArea = document.getElementById('transcriptArea');
  const metrics = document.getElementById('metricsArea');
  const rank = r.rankKey ? d.ranks[r.rankKey] : null;
  r.rank = rank ? rank[0] : null;

  if (!r.demo){
    track(r.arrested ? 'result-arrest' : (r.pass ? 'result-pass' : 'result-deny'));
  }

  if (r.arrested){
    flag.textContent = '🚔';
    title.textContent = d.titleArrest;
    stampArea.innerHTML = `<div class="stamp denied"><span class="big">${d.stampArrestBig}</span><span class="small">${d.stampArrestSmall}</span></div>`;
    verdict.innerHTML = d.verdictArrest;
    ppArea.innerHTML = `<div class="passport detention">
      <div class="pp-head">${d.detHead}</div>
      <div class="pp-title">${d.detTitle}</div>
      <div class="pp-grid">
        <div><div class="k">${d.kSuspect}</div><div class="v">${name}</div></div>
        <div><div class="k">${d.kCharge}</div><div class="v">${d.chargeVal}</div></div>
        <div style="grid-column:1/3"><div class="k">${d.kLaw}</div><div class="v" style="font-size:13px">${d.lawVal}</div></div>
        <div><div class="k">${d.kSentence}</div><div class="v" style="font-size:13px">${d.sentenceVal}</div></div>
        <div><div class="k">${d.kParole}</div><div class="v" style="font-size:13px">${d.paroleVal}</div></div>
      </div>
      <div class="pp-seal">⛓️</div>
    </div>
    <div class="evidence">${d.evidence(Math.round(r.wpm), Math.round(r.clarity===null?0:r.clarity))}</div>`;
  } else if (r.pass){
    flag.textContent = '🏝️';
    title.textContent = d.titlePass;
    stampArea.innerHTML = `<div class="stamp passed"><span class="big">${d.stampPassBig}</span><span class="small">${d.stampPassSmall}</span></div>`;
    verdict.innerHTML = d.verdictPass;
    const no = 'BRK-' + String(Math.floor(Math.random()*90000)+10000);
    const today = new Date();
    const dateStr = today.getFullYear() + '.' + String(today.getMonth()+1).padStart(2,'0') + '.' + String(today.getDate()).padStart(2,'0');
    ppArea.innerHTML = `<div class="passport">
      <div class="pp-head">${d.ppHead}</div>
      <div class="pp-title">${d.ppTitle}</div>
      <div class="pp-grid">
        <div><div class="k">${d.kName}</div><div class="v">${name}</div></div>
        <div><div class="k">${d.kRank}</div><div class="v">${rank[0]}</div></div>
        <div><div class="k">${d.kBroken}</div><div class="v">${r.heta}${d.ptSuffix}</div></div>
        <div><div class="k">${d.kResident}</div><div class="v">${no}</div></div>
        <div><div class="k">${d.kIssued}</div><div class="v">${dateStr}</div></div>
        <div><div class="k">${d.kValid}</div><div class="v">${d.validVal}</div></div>
      </div>
      <div class="pp-seal">🦀</div>
    </div>
    <div class="verdict-msg" style="margin-top:-6px">${rank[1]}</div>`;
  } else {
    flag.textContent = '⛔';
    title.textContent = d.titleDeny;
    stampArea.innerHTML = `<div class="stamp denied"><span class="big">${d.stampDenyBig}</span><span class="small">${d.stampDenySmall}</span></div>`;
    verdict.innerHTML = d.verdictDeny;
    ppArea.innerHTML = '';
  }

  trArea.innerHTML = r.transcript
    ? `<div class="transcript">${d.transcriptLabel}: “${r.transcript.slice(0,180)}${r.transcript.length>180?'…':''}”</div>` : '';

  let mh = '';
  if (r.earOnly){
    mh += `<div class="transcript">${d.earOnlyNote}</div>`;
  }
  mh += metricRow(d.mSpeed, Math.min(100, (r.wpm||0)/140*100), (r.wpm||0) < 85, d.nSpeed(Math.round(r.wpm||0)));
  mh += metricRow(d.mSilence, (r.pauseRatio||0)*100, (r.pauseRatio||0) > 0.3, d.nSilence(Math.round((r.pauseRatio||0)*100)));
  if (r.asrWorked){
    mh += metricRow(d.mClarity, r.clarity===null?65:r.clarity, (r.clarity===null?65:r.clarity) < 70, d.nClarity);
    mh += metricRow(d.mVocab, Math.min(100,(r.advCount||0)*25), (r.advCount||0) < 2, d.nVocab(r.advCount||0));
  }
  metrics.innerHTML = mh;
  document.getElementById('copyBtn').innerHTML = d.copyBtn;

  show('screen-result');
  const card = document.getElementById('resultCard');
  card.classList.remove('shake'); void card.offsetWidth;
  setTimeout(() => card.classList.add('shake'), 280);
  setTimeout(() => {
    metrics.querySelectorAll('.bar > div').forEach(b => { b.style.width = b.dataset.w + '%'; });
  }, 350);
}

/* ---------- share ---------- */
function copyResult(){
  if (!lastResult) return;
  const r = lastResult, d = I18N[LANG];
  const text = r.arrested ? d.shareArrest() : (r.pass ? d.sharePass(r) : d.shareDeny(r));
  track('share-copy');
  const btn = document.getElementById('copyBtn');
  const done = () => { btn.innerHTML = d.copied; btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML = d.copyBtn; btn.classList.remove('copied'); }, 2200); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(_){}
  document.body.removeChild(ta); done();
}

/* ---------- init ---------- */
applyLang();
